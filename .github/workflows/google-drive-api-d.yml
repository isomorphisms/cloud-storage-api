name: Google Drive D client

on:
  push:
    paths:
      - 'commands/google_drive_api.d'
      - 'commands/google-drive-v3-methods.tsv'
      - 'tests/google-drive-api-d.sh'
      - 'tests/google-drive-api-d-server.mjs'
      - 'd/Makefile'
      - '.github/workflows/google-drive-api-d.yml'
  pull_request:
    paths:
      - 'commands/google_drive_api.d'
      - 'commands/google-drive-v3-methods.tsv'
      - 'tests/google-drive-api-d.sh'
      - 'tests/google-drive-api-d-server.mjs'
      - 'd/Makefile'
      - '.github/workflows/google-drive-api-d.yml'

jobs:
  d-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install D compiler and libcurl headers
        run: |
          sudo apt-get update
          sudo apt-get install -y ldc libcurl4-openssl-dev
      - name: Build
        run: make -C d
      - name: Exercise thin Drive surface and resumable recovery
        run: make -C d test
