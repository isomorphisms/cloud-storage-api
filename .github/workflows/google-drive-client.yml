name: Google Drive authenticated client contracts

on:
  pull_request:
    paths:
      - AGENTS.md
      - README.md
      - commands/google-drive-api.grease
      - commands/google-drive-auth.grease
      - commands/google-drive-download.grease
      - commands/google-drive-download-state.c
      - commands/google-oauth-loopback.c
      - docs/google-drive-auth-download.md
      - tests/google-drive-auth.sh
      - tests/google-drive-download.sh
      - .github/workflows/google-drive-client.yml
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - README.md
      - commands/google-drive-api.grease
      - commands/google-drive-auth.grease
      - commands/google-drive-download.grease
      - commands/google-drive-download-state.c
      - commands/google-oauth-loopback.c
      - docs/google-drive-auth-download.md
      - tests/google-drive-auth.sh
      - tests/google-drive-download.sh
      - .github/workflows/google-drive-client.yml

concurrency:
  group: google-drive-client-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GREASE_SOURCE_REVISION: 8052868773077602266d80bf39aad6998e2da749

jobs:
  oauth-and-restartable-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: python:2.7.18-buster@sha256:c934af72b8bd03b9804d5bde2569c320926e70392d708d113a2e71bcf98c8a20
    steps:
      - name: Check out cloud storage commands
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check out exact Grease source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/oils
          ref: ${{ env.GREASE_SOURCE_REVISION }}
          path: grease-source
          persist-credentials: false

      - name: Build fixed-width helpers and exact Grease runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C grease-source rev-parse HEAD)" = "$GREASE_SOURCE_REVISION"
          mkdir -p _/test-bin
          cc -std=c99 -Wall -Wextra -Werror -O2 \
            commands/google-oauth-loopback.c \
            -o _/test-bin/google-oauth-loopback
          cc -std=c99 -Wall -Wextra -Werror -O2 \
            commands/google-drive-download-state.c \
            -o _/test-bin/google-drive-download-state
          (cd grease-source && build/py.sh minimal)
          grease-source/bin/osh -c 'echo grease-runtime-ready'

      - name: Install pinned jq for client contracts
        shell: bash
        env:
          JQ_URL: https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64
          JQ_SHA256: 020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d
        run: |
          set -euo pipefail
          python2 - <<'PY'
          import hashlib
          import os
          import urllib2

          data = urllib2.urlopen(os.environ['JQ_URL']).read()
          actual = hashlib.sha256(data).hexdigest()
          if actual != os.environ['JQ_SHA256']:
              raise SystemExit('jq SHA-256 mismatch: %s' % actual)
          with open('_/test-bin/jq', 'wb') as output:
              output.write(data)
          PY
          chmod +x _/test-bin/jq
          test "$(_/test-bin/jq --version)" = jq-1.8.1

      - name: Exercise OAuth and restartable download state machines
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/_/test-bin:$PATH"
          export GREASE="$PWD/grease-source/bin/osh"
          export GOOGLE_OAUTH_LOOPBACK="$PWD/_/test-bin/google-oauth-loopback"
          export GOOGLE_DRIVE_DOWNLOAD_STATE="$PWD/_/test-bin/google-drive-download-state"
          sh tests/google-drive-auth.sh
          sh tests/google-drive-download.sh

      - name: State evidence boundary
        shell: sh
        run: |
          printf '%s\n' \
            'PASS: exact pinned Grease with fake OAuth/Drive transports and deterministic local durability/range corruption cases; not live Google authorization, authenticated Drive, Takeout, or physical Android evidence.'


  live-drive-probe:
    name: Live Drive API probe
    environment: google-drive-live
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
    steps:
      - name: Check out live probe source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Build ZIP central-directory helper
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c99 -Wall -Wextra -Werror -O2 \
            commands/zip-central-directory.c \
            -o "$RUNNER_TEMP/zip-central-directory"
          printf 'ZIP_CENTRAL_DIRECTORY=%s\n' "$RUNNER_TEMP/zip-central-directory" >> "$GITHUB_ENV"
          printf '%s\n' 'PASS: bounded ZIP / ZIP64 parser built.'

      - name: Validate live credential inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_OAUTH_CLIENT_ID"
          test -n "$GOOGLE_OAUTH_CLIENT_SECRET"
          test -n "$GOOGLE_DRIVE_REFRESH_TOKEN"
          printf '%s\n' 'PASS: live OAuth material is present.'

      - name: Refresh access token without secrets in argv
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          id_file="$RUNNER_TEMP/client-id"
          secret_file="$RUNNER_TEMP/client-secret"
          refresh_file="$RUNNER_TEMP/refresh-token"
          token_config="$RUNNER_TEMP/token.curl"
          token_response="$RUNNER_TEMP/token.json"

          printf '%s' "$GOOGLE_OAUTH_CLIENT_ID" > "$id_file"
          printf '%s' "$GOOGLE_OAUTH_CLIENT_SECRET" > "$secret_file"
          printf '%s' "$GOOGLE_DRIVE_REFRESH_TOKEN" > "$refresh_file"

          cat > "$token_config" <<EOF
          url = "https://oauth2.googleapis.com/token"
          request = "POST"
          silent
          show-error
          fail-with-body
          header = "Content-Type: application/x-www-form-urlencoded"
          data-urlencode = "client_id@$id_file"
          data-urlencode = "client_secret@$secret_file"
          data-urlencode = "refresh_token@$refresh_file"
          data = "grant_type=refresh_token"
          output = "$token_response"
          EOF

          curl --config "$token_config"

          jq -e '.access_token | strings | select(length > 0)' "$token_response" >/dev/null
          access_token="$(jq -r '.access_token' "$token_response")"
          drive_config="$RUNNER_TEMP/drive.curl"
          printf 'header = "Authorization: Bearer %s"\n' "$access_token" > "$drive_config"
          chmod 600 "$drive_config"
          unset access_token

          printf 'DRIVE_CURL_CONFIG=%s\n' "$drive_config" >> "$GITHUB_ENV"
          printf '%s\n' 'PASS: access token refreshed.'

      - name: Probe Drive API and print exact provider error
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/drive-probe.json"

          status="$(
            curl               --config "$DRIVE_CURL_CONFIG"               --silent               --show-error               --output "$body"               --write-out '%{http_code}'               'https://www.googleapis.com/drive/v3/files?pageSize=1&fields=files(id)'
          )"

          printf 'drive_http_status=%s\n' "$status"

          if test "$status" != 200; then
            jq '{error: (.error // .)}' "$body"
            exit 1
          fi

          jq -e '.files | arrays' "$body" >/dev/null
          printf '%s\n' 'PASS: authenticated Drive files.list succeeded.'


      - name: Locate exact ChatGPT Takeout
        shell: bash
        run: |
          set -euo pipefail
          expected_name='takeout-20260505T145639Z-3-001.zip'
          expected_size='7754047385'
          known_id='1bxJArJwUaarp55NuTsMKbck05So9yXyi'
          body="$RUNNER_TEMP/takeout-list.json"

          status="$(
            curl               --config "$DRIVE_CURL_CONFIG"               --silent               --show-error               --get               --data-urlencode "q=name = '$expected_name' and trashed = false"               --data-urlencode 'pageSize=1000'               --data-urlencode 'spaces=drive'               --data-urlencode 'fields=files(id,name,size,mimeType,modifiedTime,sha256Checksum,capabilities(canDownload)),nextPageToken,incompleteSearch'               --output "$body"               --write-out '%{http_code}'               'https://www.googleapis.com/drive/v3/files'
          )"

          test "$status" = 200 || {
            printf 'takeout_list_http_status=%s\n' "$status"
            jq '{error: (.error // .)}' "$body"
            exit 1
          }

          count="$(jq '.files | length' "$body")"
          test "$count" -gt 0 || {
            printf '%s\n' 'FAIL: exact Takeout name was not found in this authorized Drive account.' >&2
            exit 1
          }

          file_id="$(
            jq -r --arg known "$known_id" '
              if ([.files[] | select(.id == $known)] | length) == 1
              then [.files[] | select(.id == $known)][0].id
              elif (.files | length) == 1
              then .files[0].id
              else empty
              end
            ' "$body"
          )"

          test -n "$file_id" || {
            printf 'FAIL: %s exact-name matches and no unique known-id match.\n' "$count" >&2
            jq '.files | map({id,name,size,mimeType,modifiedTime})' "$body"
            exit 1
          }

          metadata="$RUNNER_TEMP/takeout-metadata.json"
          status="$(
            curl               --config "$DRIVE_CURL_CONFIG"               --silent               --show-error               --get               --data-urlencode 'supportsAllDrives=true'               --data-urlencode 'fields=id,name,size,mimeType,modifiedTime,sha256Checksum,capabilities(canDownload)'               --output "$metadata"               --write-out '%{http_code}'               "https://www.googleapis.com/drive/v3/files/$file_id"
          )"

          test "$status" = 200 || {
            printf 'metadata_http_status=%s\n' "$status"
            jq '{error: (.error // .)}' "$metadata"
            exit 1
          }

          jq -e --arg n "$expected_name" --arg s "$expected_size" '
            .name == $n and .size == $s and .capabilities.canDownload == true
          ' "$metadata" >/dev/null

          printf 'TAKEOUT_FILE_ID=%s\n' "$file_id" >> "$GITHUB_ENV"
          printf 'TAKEOUT_SIZE=%s\n' "$expected_size" >> "$GITHUB_ENV"

          jq '{id,name,size,mimeType,modifiedTime,sha256Checksum,canDownload:.capabilities.canDownload}' "$metadata"
          printf '%s\n' 'PASS: exact Takeout identity and 7,754,047,385-byte size verified.'

      - name: Perform bounded Takeout tail range read
        shell: bash
        run: |
          set -euo pipefail
          length=65577
          start=$((TAKEOUT_SIZE - length))
          end=$((TAKEOUT_SIZE - 1))
          headers="$RUNNER_TEMP/range.headers"
          body="$RUNNER_TEMP/tail.bin"

          status="$(
            curl               --config "$DRIVE_CURL_CONFIG"               --silent               --show-error               --request GET               --header "Range: bytes=$start-$end"               --dump-header "$headers"               --max-filesize "$length"               --output "$body"               --write-out '%{http_code}'               "https://www.googleapis.com/drive/v3/files/$TAKEOUT_FILE_ID?alt=media&supportsAllDrives=true"
          )"

          test "$status" = 206 || {
            printf 'range_http_status=%s\n' "$status"
            exit 1
          }

          tr -d '\r' < "$headers" |
            grep -Fxi "Content-Range: bytes $start-$end/$TAKEOUT_SIZE" >/dev/null

          actual="$(wc -c < "$body" | tr -d '[:space:]')"
          test "$actual" = "$length"

          printf 'range_start=%s\nrange_end=%s\nrange_length=%s\n' "$start" "$end" "$length"
          printf 'range_sha256=%s\n' "$(sha256sum "$body" | awk '{print $1}')"
          printf '%s\n' 'PASS: real authenticated bounded Drive HTTP 206 range read; no full archive download.'


      - name: Inventory ChatGPT core members without downloading the archive
        shell: bash
        run: |
          set -euo pipefail

          zip="$ZIP_CENTRAL_DIRECTORY"
          size="$TAKEOUT_SIZE"
          file_id="$TAKEOUT_FILE_ID"
          temp="$RUNNER_TEMP/takeout-inventory"
          mkdir -p "$temp"

          fetch_range() {
            start=$1
            end=$2
            length=$3
            output=$4
            headers="$output.headers"

            status="$(
              curl \
                --config "$DRIVE_CURL_CONFIG" \
                --silent \
                --show-error \
                --request GET \
                --header "Range: bytes=$start-$end" \
                --dump-header "$headers" \
                --max-filesize "$length" \
                --output "$output" \
                --write-out '%{http_code}' \
                "https://www.googleapis.com/drive/v3/files/$file_id?alt=media&supportsAllDrives=true"
            )"

            test "$status" = 206
            tr -d '\r' < "$headers" |
              grep -Fxi "Content-Range: bytes $start-$end/$size" >/dev/null
            test "$(wc -c < "$output" | tr -d '[:space:]')" = "$length"
          }

          tab="$(printf '\t')"
          tail_spec="$("$zip" tail "$size")"
          IFS="$tab" read -r tail_start tail_end tail_length <<EOF
          $tail_spec
          EOF
          fetch_range "$tail_start" "$tail_end" "$tail_length" "$temp/tail.bin"

          eocd="$("$zip" eocd "$size" "$tail_start" "$temp/tail.bin")"
          IFS="$tab" read -r kind a b c d e <<EOF
          $eocd
          EOF

          case "$kind" in
            classic)
              central_start=$a
              central_end=$b
              central_size=$c
              member_count=$d
              ;;
            zip64)
              zip64_start=$a
              zip64_end=$b
              zip64_length=$c
              locator_offset=$d
              fetch_range "$zip64_start" "$zip64_end" "$zip64_length" "$temp/zip64-eocd.bin"
              values="$("$zip" zip64-eocd "$size" "$zip64_start" "$locator_offset" "$temp/zip64-eocd.bin")"
              IFS="$tab" read -r central_start central_end central_size member_count unused <<EOF
              $values
              EOF
              ;;
            *)
              printf 'unsupported end record kind: %s\n' "$kind" >&2
              exit 1
              ;;
          esac

          if test "$central_size" -eq 0; then
            : > "$temp/central.bin"
          else
            fetch_range "$central_start" "$central_end" "$central_size" "$temp/central.bin"
          fi

          "$zip" list "$central_start" "$central_size" "$member_count" "$temp/central.bin" > "$temp/members.ndjson"

          jq -c '
            select(
              (.path == "conversations.json") or
              (.path | endswith("/conversations.json")) or
              (.path == "chat.html") or
              (.path | endswith("/chat.html")) or
              (.path == "user.json") or
              (.path | endswith("/user.json")) or
              (.path == "message_feedback.json") or
              (.path | endswith("/message_feedback.json")) or
              (.path == "shared_conversations.json") or
              (.path | endswith("/shared_conversations.json"))
            )
          ' "$temp/members.ndjson" > "$temp/core.ndjson"

          core_count="$(wc -l < "$temp/core.ndjson" | tr -d '[:space:]')"
          test "$core_count" -gt 0 || {
            printf '%s\n' 'FAIL: no expected ChatGPT core export members were found.' >&2
            exit 1
          }

          printf 'archive_zip64=%s\n' "$([ "$kind" = zip64 ] && echo true || echo false)"
          printf 'archive_member_count=%s\n' "$member_count"
          printf 'central_directory_size=%s\n' "$central_size"
          printf 'selected_core_member_count=%s\n' "$core_count"
          jq -c '{path,compressed_size,uncompressed_size,compression_method,crc32,local_header_offset}' "$temp/core.ndjson"

          conversations_count="$(
            jq -s '[.[] | select(.path == "conversations.json" or (.path | endswith("/conversations.json")))] | length'               "$temp/core.ndjson"
          )"
          test "$conversations_count" -eq 1 || {
            printf 'FAIL: expected exactly one conversations.json member, found %s\n' "$conversations_count" >&2
            exit 1
          }

          jq -c 'select(.path == "conversations.json" or (.path | endswith("/conversations.json")))'             "$temp/core.ndjson" > "$temp/conversations-member.json"

          printf 'TAKEOUT_INVENTORY_DIR=%s\n' "$temp" >> "$GITHUB_ENV"
          printf '%s\n' 'PASS: live 7.75 GB Takeout central directory validated and ChatGPT core members inventoried with bounded range reads only.'

      - name: Extract conversations.json remotely and verify it
        shell: bash
        run: |
          set -euo pipefail

          member="$TAKEOUT_INVENTORY_DIR/conversations-member.json"
          file_id="$TAKEOUT_FILE_ID"
          size="$TAKEOUT_SIZE"
          offset="$(jq -r '.local_header_offset' "$member")"
          compressed_size="$(jq -r '.compressed_size' "$member")"
          expected_uncompressed="$(jq -r '.uncompressed_size' "$member")"
          expected_method="$(jq -r '.compression_method' "$member")"
          expected_crc="$(jq -r '.crc32' "$member")"
          expected_path="$(jq -r '.path' "$member")"

          fixed="$RUNNER_TEMP/local-fixed.bin"
          fixed_end=$((offset + 29))
          status="$(
            curl \
              --config "$DRIVE_CURL_CONFIG" \
              --silent \
              --show-error \
              --request GET \
              --header "Range: bytes=$offset-$fixed_end" \
              --max-filesize 30 \
              --output "$fixed" \
              --write-out '%{http_code}' \
              "https://www.googleapis.com/drive/v3/files/$file_id?alt=media&supportsAllDrives=true"
          )"
          test "$status" = 206
          test "$(wc -c < "$fixed" | tr -d '[:space:]')" = 30

          header_info="$(
            python3 - "$fixed" <<'PY'
          import struct, sys
          data = open(sys.argv[1], 'rb').read()
          if len(data) != 30:
              raise SystemExit('local fixed header must be 30 bytes')
          sig, version, flags, method, mtime, mdate, crc, csize, usize, name_len, extra_len = struct.unpack('<IHHHHHIIIHH', data)
          if sig != 0x04034B50:
              raise SystemExit('local file header signature mismatch')
          print(flags, method, crc, csize, usize, name_len, extra_len)
          PY
          )"
          read -r local_flags local_method local_crc local_csize local_usize name_len extra_len <<EOF
          $header_info
          EOF

          test "$local_method" = "$expected_method"
          header_length=$((30 + name_len + extra_len))
          header_end=$((offset + header_length - 1))
          header="$RUNNER_TEMP/local-header.bin"

          status="$(
            curl \
              --config "$DRIVE_CURL_CONFIG" \
              --silent \
              --show-error \
              --request GET \
              --header "Range: bytes=$offset-$header_end" \
              --max-filesize "$header_length" \
              --output "$header" \
              --write-out '%{http_code}' \
              "https://www.googleapis.com/drive/v3/files/$file_id?alt=media&supportsAllDrives=true"
          )"
          test "$status" = 206
          test "$(wc -c < "$header" | tr -d '[:space:]')" = "$header_length"

          actual_path="$(
            python3 - "$header" "$name_len" <<'PY'
          import sys
          data = open(sys.argv[1], 'rb').read()
          n = int(sys.argv[2])
          sys.stdout.write(data[30:30+n].decode('utf-8'))
          PY
          )"
          test "$actual_path" = "$expected_path"

          data_start=$((offset + header_length))
          data_end=$((data_start + compressed_size - 1))
          compressed="$RUNNER_TEMP/conversations.compressed"

          status="$(
            curl \
              --config "$DRIVE_CURL_CONFIG" \
              --silent \
              --show-error \
              --request GET \
              --header "Range: bytes=$data_start-$data_end" \
              --max-filesize "$compressed_size" \
              --output "$compressed" \
              --write-out '%{http_code}' \
              "https://www.googleapis.com/drive/v3/files/$file_id?alt=media&supportsAllDrives=true"
          )"
          test "$status" = 206
          test "$(wc -c < "$compressed" | tr -d '[:space:]')" = "$compressed_size"

          output="$RUNNER_TEMP/conversations.json"
          python3 - "$compressed" "$output" "$expected_method" "$expected_crc" "$expected_uncompressed" <<'PY'
          import binascii, shutil, sys, zlib

          source, destination, method_text, expected_crc, expected_size_text = sys.argv[1:]
          method = int(method_text)
          expected_size = int(expected_size_text)
          crc = 0
          written = 0

          with open(source, 'rb') as inp, open(destination, 'wb') as out:
              if method == 0:
                  while True:
                      chunk = inp.read(1024 * 1024)
                      if not chunk:
                          break
                      out.write(chunk)
                      crc = binascii.crc32(chunk, crc)
                      written += len(chunk)
              elif method == 8:
                  decompressor = zlib.decompressobj(-zlib.MAX_WBITS)
                  while True:
                      chunk = inp.read(1024 * 1024)
                      if not chunk:
                          break
                      plain = decompressor.decompress(chunk)
                      if plain:
                          out.write(plain)
                          crc = binascii.crc32(plain, crc)
                          written += len(plain)
                  plain = decompressor.flush()
                  if plain:
                      out.write(plain)
                      crc = binascii.crc32(plain, crc)
                      written += len(plain)
              else:
                  raise SystemExit('unsupported compression method')

          actual_crc = f'{crc & 0xffffffff:08x}'
          if written != expected_size:
              raise SystemExit(f'uncompressed size mismatch: {written} != {expected_size}')
          if actual_crc.lower() != expected_crc.lower():
              raise SystemExit(f'CRC mismatch: {actual_crc} != {expected_crc}')
          print(f'uncompressed_size={written}')
          print(f'crc32={actual_crc}')
          PY

          jq -e 'type == "array"' "$output" >/dev/null
          conversation_count="$(jq 'length' "$output")"
          output_sha256="$(sha256sum "$output" | awk '{print $1}')"

          printf 'member_path=%s\n' "$expected_path"
          printf 'conversation_count=%s\n' "$conversation_count"
          printf 'output_sha256=%s\n' "$output_sha256"
          printf '%s\n' 'PASS: conversations.json was remotely extracted from the 7.75 GB Drive ZIP by bounded member-range reads and verified by size, CRC32, JSON shape, and SHA-256.'
          printf '%s\n' 'NOTE: extracted content remained only in the ephemeral runner and was not published as an artifact.'
