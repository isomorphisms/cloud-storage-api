name: Google Drive authenticated client contracts

on:
  pull_request:
    paths:
      - AGENTS.md
      - README.md
      - commands/google-drive-api.grease
      - commands/google-drive-auth.grease
      - commands/google-drive-download.grease
      - commands/google-drive-download-state.c
      - commands/google-oauth-loopback.c
      - docs/google-drive-auth-download.md
      - tests/google-drive-auth.sh
      - tests/google-drive-download.sh
      - tests/live-takeout-extract.sh
      - tests/live-find-chatgpt-export.sh
      - .github/workflows/google-drive-client.yml
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - README.md
      - commands/google-drive-api.grease
      - commands/google-drive-auth.grease
      - commands/google-drive-download.grease
      - commands/google-drive-download-state.c
      - commands/google-oauth-loopback.c
      - docs/google-drive-auth-download.md
      - tests/google-drive-auth.sh
      - tests/google-drive-download.sh
      - tests/live-takeout-extract.sh
      - tests/live-find-chatgpt-export.sh
      - .github/workflows/google-drive-client.yml

concurrency:
  group: google-drive-client-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GREASE_SOURCE_REVISION: 8052868773077602266d80bf39aad6998e2da749

jobs:
  oauth-and-restartable-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: python:2.7.18-buster@sha256:c934af72b8bd03b9804d5bde2569c320926e70392d708d113a2e71bcf98c8a20
    steps:
      - name: Check out cloud storage commands
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check out exact Grease source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/oils
          ref: ${{ env.GREASE_SOURCE_REVISION }}
          path: grease-source
          persist-credentials: false

      - name: Build fixed-width helpers and exact Grease runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C grease-source rev-parse HEAD)" = "$GREASE_SOURCE_REVISION"
          mkdir -p _/test-bin
          cc -std=c99 -Wall -Wextra -Werror -O2 \
            commands/google-oauth-loopback.c \
            -o _/test-bin/google-oauth-loopback
          cc -std=c99 -Wall -Wextra -Werror -O2 \
            commands/google-drive-download-state.c \
            -o _/test-bin/google-drive-download-state
          (cd grease-source && build/py.sh minimal)
          grease-source/bin/osh -c 'echo grease-runtime-ready'

      - name: Install pinned jq for client contracts
        shell: bash
        env:
          JQ_URL: https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64
          JQ_SHA256: 020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d
        run: |
          set -euo pipefail
          python2 - <<'PY'
          import hashlib
          import os
          import urllib2

          data = urllib2.urlopen(os.environ['JQ_URL']).read()
          actual = hashlib.sha256(data).hexdigest()
          if actual != os.environ['JQ_SHA256']:
              raise SystemExit('jq SHA-256 mismatch: %s' % actual)
          with open('_/test-bin/jq', 'wb') as output:
              output.write(data)
          PY
          chmod +x _/test-bin/jq
          test "$(_/test-bin/jq --version)" = jq-1.8.1

      - name: Exercise OAuth and restartable download state machines
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/_/test-bin:$PATH"
          export GREASE="$PWD/grease-source/bin/osh"
          export GOOGLE_OAUTH_LOOPBACK="$PWD/_/test-bin/google-oauth-loopback"
          export GOOGLE_DRIVE_DOWNLOAD_STATE="$PWD/_/test-bin/google-drive-download-state"
          sh tests/google-drive-auth.sh
          sh tests/google-drive-download.sh

      - name: State evidence boundary
        shell: sh
        run: |
          printf '%s\n' \
            'PASS: exact pinned Grease with fake OAuth/Drive transports and deterministic local durability/range corruption cases; not live Google authorization, authenticated Drive, Takeout, or physical Android evidence.'


  live-drive-probe:
    name: Live Drive API probe
    environment: google-drive-live
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
    steps:
      - name: Check out live probe source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate live credential inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_OAUTH_CLIENT_ID"
          test -n "$GOOGLE_OAUTH_CLIENT_SECRET"
          test -n "$GOOGLE_DRIVE_REFRESH_TOKEN"
          printf '%s\n' 'PASS: live OAuth material is present.'

      - name: Refresh access token without secrets in argv
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          id_file="$RUNNER_TEMP/client-id"
          secret_file="$RUNNER_TEMP/client-secret"
          refresh_file="$RUNNER_TEMP/refresh-token"
          token_config="$RUNNER_TEMP/token.curl"
          token_response="$RUNNER_TEMP/token.json"

          printf '%s' "$GOOGLE_OAUTH_CLIENT_ID" > "$id_file"
          printf '%s' "$GOOGLE_OAUTH_CLIENT_SECRET" > "$secret_file"
          printf '%s' "$GOOGLE_DRIVE_REFRESH_TOKEN" > "$refresh_file"

          cat > "$token_config" <<EOF
          url = "https://oauth2.googleapis.com/token"
          request = "POST"
          silent
          show-error
          fail-with-body
          header = "Content-Type: application/x-www-form-urlencoded"
          data-urlencode = "client_id@$id_file"
          data-urlencode = "client_secret@$secret_file"
          data-urlencode = "refresh_token@$refresh_file"
          data = "grant_type=refresh_token"
          output = "$token_response"
          EOF

          curl --config "$token_config"

          jq -e '.access_token | strings | select(length > 0)' "$token_response" >/dev/null
          access_token="$(jq -r '.access_token' "$token_response")"
          drive_config="$RUNNER_TEMP/drive.curl"
          printf 'header = "Authorization: Bearer %s"\n' "$access_token" > "$drive_config"
          chmod 600 "$drive_config"
          unset access_token

          printf 'DRIVE_CURL_CONFIG=%s\n' "$drive_config" >> "$GITHUB_ENV"
          printf '%s\n' 'PASS: access token refreshed.'

      - name: Probe Drive API and print exact provider error
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/drive-probe.json"

          status="$(
            curl               --config "$DRIVE_CURL_CONFIG"               --silent               --show-error               --output "$body"               --write-out '%{http_code}'               'https://www.googleapis.com/drive/v3/files?pageSize=1&fields=files(id)'
          )"

          printf 'drive_http_status=%s\n' "$status"

          if test "$status" != 200; then
            jq '{error: (.error // .)}' "$body"
            exit 1
          fi

          jq -e '.files | arrays' "$body" >/dev/null
          printf '%s\n' 'PASS: authenticated Drive files.list succeeded.'


      - name: Locate exact ChatGPT Takeout
        shell: bash
        run: |
          set -euo pipefail
          expected_name='takeout-20260505T145639Z-3-001.zip'
          expected_size='7754047385'
          known_id='1bxJArJwUaarp55NuTsMKbck05So9yXyi'
          body="$RUNNER_TEMP/takeout-list.json"

          status="$(
            curl               --config "$DRIVE_CURL_CONFIG"               --silent               --show-error               --get               --data-urlencode "q=name = '$expected_name' and trashed = false"               --data-urlencode 'pageSize=1000'               --data-urlencode 'spaces=drive'               --data-urlencode 'fields=files(id,name,size,mimeType,modifiedTime,sha256Checksum,capabilities(canDownload)),nextPageToken,incompleteSearch'               --output "$body"               --write-out '%{http_code}'               'https://www.googleapis.com/drive/v3/files'
          )"

          test "$status" = 200 || {
            printf 'takeout_list_http_status=%s\n' "$status"
            jq '{error: (.error // .)}' "$body"
            exit 1
          }

          count="$(jq '.files | length' "$body")"
          test "$count" -gt 0 || {
            printf '%s\n' 'FAIL: exact Takeout name was not found in this authorized Drive account.' >&2
            exit 1
          }

          file_id="$(
            jq -r --arg known "$known_id" '
              if ([.files[] | select(.id == $known)] | length) == 1
              then [.files[] | select(.id == $known)][0].id
              elif (.files | length) == 1
              then .files[0].id
              else empty
              end
            ' "$body"
          )"

          test -n "$file_id" || {
            printf 'FAIL: %s exact-name matches and no unique known-id match.\n' "$count" >&2
            jq '.files | map({id,name,size,mimeType,modifiedTime})' "$body"
            exit 1
          }

          metadata="$RUNNER_TEMP/takeout-metadata.json"
          status="$(
            curl               --config "$DRIVE_CURL_CONFIG"               --silent               --show-error               --get               --data-urlencode 'supportsAllDrives=true'               --data-urlencode 'fields=id,name,size,mimeType,modifiedTime,sha256Checksum,capabilities(canDownload)'               --output "$metadata"               --write-out '%{http_code}'               "https://www.googleapis.com/drive/v3/files/$file_id"
          )"

          test "$status" = 200 || {
            printf 'metadata_http_status=%s\n' "$status"
            jq '{error: (.error // .)}' "$metadata"
            exit 1
          }

          jq -e --arg n "$expected_name" --arg s "$expected_size" '
            .name == $n and .size == $s and .capabilities.canDownload == true
          ' "$metadata" >/dev/null

          printf 'TAKEOUT_FILE_ID=%s\n' "$file_id" >> "$GITHUB_ENV"
          printf 'TAKEOUT_SIZE=%s\n' "$expected_size" >> "$GITHUB_ENV"

          jq '{id,name,size,mimeType,modifiedTime,sha256Checksum,canDownload:.capabilities.canDownload}' "$metadata"
          printf '%s\n' 'PASS: exact Takeout identity and 7,754,047,385-byte size verified.'

      - name: Perform bounded Takeout tail range read
        shell: bash
        run: |
          set -euo pipefail
          length=65577
          start=$((TAKEOUT_SIZE - length))
          end=$((TAKEOUT_SIZE - 1))
          headers="$RUNNER_TEMP/range.headers"
          body="$RUNNER_TEMP/tail.bin"

          status="$(
            curl               --config "$DRIVE_CURL_CONFIG"               --silent               --show-error               --request GET               --header "Range: bytes=$start-$end"               --dump-header "$headers"               --max-filesize "$length"               --output "$body"               --write-out '%{http_code}'               "https://www.googleapis.com/drive/v3/files/$TAKEOUT_FILE_ID?alt=media&supportsAllDrives=true"
          )"

          test "$status" = 206 || {
            printf 'range_http_status=%s\n' "$status"
            exit 1
          }

          tr -d '\r' < "$headers" |
            grep -Fxi "Content-Range: bytes $start-$end/$TAKEOUT_SIZE" >/dev/null

          actual="$(wc -c < "$body" | tr -d '[:space:]')"
          test "$actual" = "$length"

          printf 'range_start=%s\nrange_end=%s\nrange_length=%s\n' "$start" "$end" "$length"
          printf 'range_sha256=%s\n' "$(sha256sum "$body" | awk '{print $1}')"
          printf '%s\n' 'PASS: real authenticated bounded Drive HTTP 206 range read; no full archive download.'

      - name: Inventory and selectively extract real Takeout member
        shell: bash
        run: |
          set -euo pipefail
          bash tests/live-takeout-extract.sh

      - name: Check for actual ChatGPT export
        shell: bash
        run: |
          set -euo pipefail
          set +e
          bash tests/live-find-chatgpt-export.sh
          status=$?
          set -e

          case "$status" in
            0)
              ;;
            4)
              printf '%s\n' 'SOURCE ABSENT: no actual ChatGPT/OpenAI export ZIP is present in this authorized Drive account; this does not invalidate the successful Takeout selective-extraction evidence.'
              ;;
            *)
              exit "$status"
              ;;
          esac
